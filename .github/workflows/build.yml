name: Build iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile DeviceSpoof.dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -framework AdSupport \
            -install_name @rpath/DeviceSpoof.dylib \
            -O2 \
            -Wall \
            -Wno-unused-function \
            -o DeviceSpoof.dylib \
            DeviceSpoof.m

      - name: Sign dylib (ad-hoc)
        run: |
          codesign --force --sign - DeviceSpoof.dylib && \
            echo "Signed successfully" || \
            echo "Ad-hoc sign skipped (no identity)"

      - name: Verify binary
        run: |
          echo "=== File info ==="
          file DeviceSpoof.dylib
          echo "=== Linked libraries ==="
          otool -L DeviceSpoof.dylib
          echo "=== Architecture ==="
          lipo -info DeviceSpoof.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSpoof-dylib
          path: DeviceSpoof.dylib
          if-no-files-found: error
